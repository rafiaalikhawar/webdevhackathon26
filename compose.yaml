services:
  database:
    image: postgres:18
    environment:
      POSTGRES_DB: relay
      POSTGRES_USER: relay_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?Set POSTGRES_OWNER_PASSWORD locally}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - relay_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay_owner -d relay"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  relay_postgres:
